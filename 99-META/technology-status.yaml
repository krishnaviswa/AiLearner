  - id: otel-genai
    category: observability
    technology: OpenTelemetry GenAI semantic conventions
    purpose: Standard spans/metrics/events for GenAI and agents
    status: experimental
    production_readiness: Official status is Development — OTel says SHOULD NOT be used in production
    notes: >
      Official document status is Development, not Experimental and not Stable
      (SRC-OTEL-GENAI-SEMCONV, SRC-OTEL-GENAI-AGENT-SPANS). Lab status enum
      "experimental" is the closest local label; do not conflate it with an
      OTel Experimental maturity. SRC-OTEL-DOCUMENT-STATUS defines Development
      as: not all pieces in place; configuration may break often; "The
      component SHOULD NOT be used in production"; MAY be removed without
      notice. Agent-specific spans exist and are all Development:
      create_agent, invoke_agent (client and internal), invoke_workflow, plan,
      execute_tool. Shared attributes such as error.type and server.port remain
      Stable from core semconv. opentelemetry.io/docs/specs/semconv/gen-ai/
      is a move stub (SRC-OTEL-GENAI-MOVED); canonical repo is
      open-telemetry/semantic-conventions-genai. No tagged GenAI spec version
      found this pass (repo README Schema URL is TODO) — do not invent a
      version number. Instrumentations SHOULD NOT capture instructions, inputs,
      or outputs by default; those attributes are Opt-In (SRC-OTEL-GENAI-SPANS).
    primary_source: SRC-OTEL-GENAI-SEMCONV
    alternatives: [vendor-tracing, langsmith, mlflow-tracing]

